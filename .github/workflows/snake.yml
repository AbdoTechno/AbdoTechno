name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AbdoTechno
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#40C4FF&color_dots=#2d3343,#0E1626,#0175C2,#02569B,#40C4FF
            dist/snake-light.svg?palette=github&color_snake=#0175C2&color_dots=#F4F8FB,#D7E3F0,#40C4FF,#0175C2,#02569B

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
